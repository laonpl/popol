<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitPoly - 스마트 포트폴리오 플랫폼</title>
    <meta name="description" content="FitPoly는 흩어진 경험과 자료를 정리하고 AI 분석으로 맞춤형 포트폴리오를 만드는 스마트 포트폴리오 플랫폼입니다." />
    <meta name="keywords" content="FitPoly, 포트폴리오, 취업 포트폴리오, 경험 정리, AI 포트폴리오, 자기소개서, 취업 준비" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fitpoly.kr/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitpoly.kr/" />
    <meta property="og:title" content="FitPoly - 스마트 포트폴리오 플랫폼" />
    <meta property="og:description" content="흩어진 경험과 자료를 정리하고 AI 분석으로 맞춤형 포트폴리오를 만들어보세요." />
    <meta property="og:image" content="https://fitpoly.kr/logo.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FitPoly",
        "url": "https://fitpoly.kr/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "흩어진 경험과 자료를 정리하고 AI 분석으로 맞춤형 포트폴리오를 만드는 스마트 포트폴리오 플랫폼"
      }
    </script>

    <!-- CDN 연결 선점 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- media="print" trick: render-blocking 제거, 로드 완료 후 all로 전환 -->
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"
      media="print" onload="this.media='all'" crossorigin />
    <noscript>
      <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"
        crossorigin />
    </noscript>
  </head>
  <!-- spellcheck를 전역으로 끄면 자소서·포트폴리오를 쓰는 동안 오타를 못 잡는다.
       브라우저 기본값(켜짐)을 쓰고, 필요한 입력에서만 개별적으로 끈다. -->
  <body>
    <style>
      @keyframes fp-boot-spin { to { transform: rotate(360deg); } }
      @keyframes fp-boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      #fp-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #ffffff;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      #fp-boot .fp-boot-logo {
        width: 52px; height: 52px; border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 47, 108, 0.18);
      }
      #fp-boot .fp-boot-spin {
        width: 30px; height: 30px;
        border: 3px solid #e9edf3; border-top-color: #002F6C; border-radius: 50%;
        animation: fp-boot-spin 0.7s linear infinite;
      }
      #fp-boot .fp-boot-label {
        margin: 0; font-size: 14px; font-weight: 600; color: #5d7186;
        letter-spacing: 0.01em; animation: fp-boot-pulse 1.4s ease-in-out infinite;
      }
    </style>
    <div id="root">
      <!-- 검색엔진/크롤러용 콘텐츠 (사용자 화면에는 보이지 않음) -->
      <main style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
        <h1>FitPoly 스마트 포트폴리오 플랫폼</h1>
        <p>FitPoly는 흩어진 경험, 문서, 프로젝트 기록을 한곳에 정리하고 AI 분석으로 채용 공고에 맞는 포트폴리오 작성을 돕는 웹 서비스입니다.</p>
        <section>
          <h2>주요 기능</h2>
          <ul>
            <li>경험 정리와 구조화</li>
            <li>AI 기반 포트폴리오 분석</li>
            <li>맞춤형 포트폴리오 작성과 내보내기</li>
          </ul>
        </section>
        <nav>
          <a href="/login">로그인</a>
          <a href="/terms">이용약관</a>
          <a href="/privacy">개인정보처리방침</a>
        </nav>
      </main>
      <!-- 로딩 스플래시: React 마운트 시 #root가 교체되며 자동 제거됨 -->
      <div id="fp-boot">
        <img class="fp-boot-logo" src="/logo.png" alt="FitPoly" width="52" height="52" />
        <div class="fp-boot-spin"></div>
        <p class="fp-boot-label">FitPoly 불러오는 중…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

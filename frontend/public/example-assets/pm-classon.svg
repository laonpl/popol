<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#ff3b9d"/><rect x="55" y="55" width="1090" height="690" rx="30" fill="#fff"/><text x="95" y="120" font-family="Arial" font-size="28" font-weight="900">CLASSON · ONBOARDING EXPERIMENT</text><text x="95" y="185" font-family="Arial" font-size="52" font-weight="900">첫 강의 시작률을 높이는 3단계</text><g font-family="Arial"><rect x="95" y="250" width="300" height="320" rx="25" fill="#f6f1ff"/><circle cx="145" cy="305" r="24" fill="#111"/><text x="138" y="313" font-size="20" fill="#fff">1</text><text x="120" y="365" font-size="27" font-weight="800">학습 목표 확인</text><text x="120" y="410" font-size="17" fill="#666">완강까지 필요한 시간과</text><text x="120" y="440" font-size="17" fill="#666">이번 주 계획을 확인해요.</text><rect x="450" y="250" width="300" height="320" rx="25" fill="#fff0f7"/><circle cx="500" cy="305" r="24" fill="#111"/><text x="493" y="313" font-size="20" fill="#fff">2</text><text x="475" y="365" font-size="27" font-weight="800">준비물 체크</text><text x="475" y="410" font-size="17" fill="#666">첫 수업 전에 필요한</text><text x="475" y="440" font-size="17" fill="#666">파일을 미리 받아요.</text><rect x="805" y="250" width="300" height="320" rx="25" fill="#efffe4"/><circle cx="855" cy="305" r="24" fill="#111"/><text x="848" y="313" font-size="20" fill="#fff">3</text><text x="830" y="365" font-size="27" font-weight="800">바로 시작</text><text x="830" y="410" font-size="17" fill="#666">이어서 볼 수 있도록</text><text x="830" y="440" font-size="17" fill="#666">학습 위치를 저장해요.</text></g><rect x="95" y="630" width="1010" height="65" rx="32" fill="#111"/><text x="135" y="672" font-family="Arial" font-size="22" font-weight="800" fill="#fff">FIRST LESSON START RATE</text><text x="900" y="675" font-family="Arial" font-size="34" font-weight="900" fill="#d6ff45">54% → 66%</text></svg>
